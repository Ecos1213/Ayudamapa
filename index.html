<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Una plataforma comunitaria para coordinar ayuda, reportar daños y organizar voluntarios" />
    <meta name="keywords" content="ayuda, mapa, voluntarios, emergencia, comunidad" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ayudamapa" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    
    <!-- Status Bar Color (Android) -->
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f2937" media="(prefers-color-scheme: dark)" />
    
    <!-- App Name & URLs -->
    <meta name="application-name" content="Ayudamapa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />
    
    <!-- Preconnect to External Resources -->
    <link rel="preconnect" href="https://tiles.openstreetmap.org" />
    <link rel="dns-prefetch" href="https://tiles.openstreetmap.org" />
    
    <title>Ayudamapa - Plataforma de Ayuda Comunitaria</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Install Prompt Handler -->
    <script>
      let deferredPrompt;
      
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        console.log('[PWA] Install prompt deferred');
      });
      
      window.addEventListener('appinstalled', () => {
        console.log('[PWA] App installed');
        deferredPrompt = null;
      });
      
      // Make deferred prompt available globally
      window.deferredInstallPrompt = () => deferredPrompt;
    </script>
  </body>
</html>
