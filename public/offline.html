<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Ayuda Mapa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: #f3f4f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        h1 {
            font-size: 28px;
            color: #111827;
            margin-bottom: 12px;
        }

        p {
            color: #6b7280;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .message {
            background: #fef3c7;
            border: 1px solid #fcd34d;
            color: #92400e;
            padding: 16px;
            border-radius: 8px;
            margin: 24px 0;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-direction: column;
            margin-top: 24px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .primary {
            background: #667eea;
            color: white;
        }

        .primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .secondary:hover {
            background: #d1d5db;
        }

        .info {
            margin-top: 24px;
            font-size: 12px;
            color: #9ca3af;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #111827;
            }

            .container {
                background: #1f2937;
                color: #f3f4f6;
            }

            h1 {
                color: #f3f4f6;
            }

            p {
                color: #d1d5db;
            }

            .icon {
                background: #374151;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1 id="title">Sin conexión</h1>
        <p id="message">
            No tienes conexión a Internet en este momento.
        </p>

        <div class="message">
            <p id="cacheMessage">
                Puedes ver los datos en caché del mapa y las solicitudes guardadas localmente.
            </p>
        </div>

        <div class="actions">
            <button class="primary" id="retry" onclick="location.reload()">
                Reintentar
            </button>
            <button class="secondary" id="home" onclick="location.href = '/'">
                Volver al inicio
            </button>
        </div>

        <div class="info">
            <p id="footer">Los cambios que hagas se sincronizarán cuando regreses en línea.</p>
        </div>
    </div>

    <script>
        // Detect language
        const lang = navigator.language?.startsWith('es') ? 'es' : 'en';

        const content = {
            es: {
                title: 'Sin conexión',
                message: 'No tienes conexión a Internet en este momento.',
                cacheMessage: 'Puedes ver los datos en caché del mapa y las solicitudes guardadas localmente.',
                retry: 'Reintentar',
                home: 'Volver al inicio',
                footer: 'Los cambios que hagas se sincronizarán cuando regreses en línea.',
            },
            en: {
                title: 'You\'re Offline',
                message: 'You don\'t have an Internet connection right now.',
                cacheMessage: 'You can view cached map data and locally saved requests.',
                retry: 'Retry',
                home: 'Go Home',
                footer: 'Changes you make will sync when you\'re back online.',
            },
        };

        const strings = content[lang] || content.en;

        document.getElementById('title').textContent = strings.title;
        document.getElementById('message').textContent = strings.message;
        document.getElementById('cacheMessage').textContent = strings.cacheMessage;
        document.getElementById('retry').textContent = strings.retry;
        document.getElementById('home').textContent = strings.home;
        document.getElementById('footer').textContent = strings.footer;

        // Check connection status
        window.addEventListener('online', () => {
            console.log('Connection restored');
            location.reload();
        });
    </script>
</body>
</html>
